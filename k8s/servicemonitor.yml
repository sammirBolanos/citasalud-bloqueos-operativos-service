apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: citasalud-bloqueos-api-monitor
  namespace: default
  labels:
    app: citasalud-bloqueos-api
    release: monitoring
spec:
  selector:
    matchLabels:
      app: citasalud-bloqueos-api
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s